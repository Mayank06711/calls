  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ======== Traditional SEO ======== -->
    <title>Know Your Style — Personalized Fashion, Reels & Social Platform</title>
    <meta name="description" content="Know Your Style (KYF) is a personalized fashion and social platform. Discover curated style suggestions, watch fashion reels, chat in real-time, and manage your wardrobe — all powered by AI-driven recommendations." />
    <meta name="keywords" content="fashion app, style recommendations, outfit planner, fashion reels, social fashion platform, wardrobe management, AI fashion, personalized style, Know Your Style, KYF" />
    <meta name="author" content="Know Your Style" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://knowyourstyle.app/" />

    <!-- ======== Open Graph (Facebook, LinkedIn, AI Crawlers) ======== -->

    <meta property="og:site_name" content="Know Your Style" />
    <meta property="og:title" content="Know Your Style — Personalized Fashion, Reels & Social Platform" />

    <meta property="og:image" content="https://knowyourstyle.app/android-chrome-512x512.png" />

    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Know Your Style logo" />
    <meta property="og:locale" content="en_US" />

    <!-- ======== Twitter Card ======== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Know Your Style — Personalized Fashion & Social Platform" />
    <meta name="twitter:description" content="AI-powered fashion recommendations, style reels, real-time chat, and wardrobe management in one social platform." />
    <meta name="twitter:image" content="https://knowyourstyle.app/android-chrome-512x512.png" />
    <meta name="twitter:image:alt" content="Know Your Style logo" />

    <!-- Allow AI crawlers explicitly -->
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />

    <!-- Structured Data: Organization (brand entity for AI citation) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Know Your Style",
      "alternateName": "KYF",
      "url": "https://knowyourstyle.app",
      "logo": "https://knowyourstyle.app/android-chrome-512x512.png",
      "description": "Know Your Style is a personalized fashion and social platform that combines AI-driven style recommendations, fashion reels, real-time messaging, and wardrobe management.",
      "foundingDate": "2025",
      "sameAs": []
    }
    </script>

    <!-- Structured Data: WebApplication (app entity for AI discovery) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Know Your Style",
      "alternateName": "KYF",
      "url": "https://knowyourstyle.app",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Web",
      "description": "A personalized fashion and social platform featuring AI style recommendations, fashion reels, real-time chat, subscription tiers (Free, Silver, Gold, Platinum), accessibility settings, and wardrobe management tools.",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Basic access with core fashion features, messaging, and privacy settings."
        },
        {
          "@type": "Offer",
          "name": "Gold",
          "description": "Premium access including theme customization, layout preferences, analytics, reels preferences, and advanced notification controls."
        },
        {
          "@type": "Offer",
          "name": "Platinum",
          "description": "Full access to all premium features including font customization, usage tracking, analytics preferences, and priority support."
        }
      ],
      "featureList": [
        "AI-powered style recommendations",
        "Fashion reels with autoplay and quality controls",
        "Real-time chat and messaging",
        "Subscription-based premium features",
        "Theme and font customization (Gold/Platinum)",
        "Accessibility settings for all users",
        "Privacy and notification controls",
        "Analytics and usage tracking dashboards"
      ],
      "screenshot": "https://knowyourstyle.app/android-chrome-512x512.png",
      "author": {
        "@type": "Organization",
        "name": "Know Your Style"
      }
    }
    </script>

    <!-- Structured Data: FAQPage (citation-worthy content for AI engines) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Know Your Style?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Know Your Style (KYF) is a personalized fashion and social platform that uses AI to deliver curated style recommendations, fashion reels, real-time messaging, and wardrobe management tools."
          }
        },
        {
          "@type": "Question",
          "name": "What features does Know Your Style offer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "KYF offers AI-powered style suggestions, fashion reels with autoplay and quality controls, real-time chat, theme and font customization for premium subscribers, accessibility settings for all users, privacy controls, analytics dashboards, and subscription tiers including Free, Gold, and Platinum plans."
          }
        },
        {
          "@type": "Question",
          "name": "Is Know Your Style accessible for users with disabilities?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Know Your Style provides accessibility settings — including font size, font family, high contrast mode, reduced motion, and screen reader support — to all users at no extra cost, regardless of subscription tier."
          }
        },
        {
          "@type": "Question",
          "name": "What are the subscription tiers on Know Your Style?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Know Your Style offers Free, Silver, Gold, and Platinum tiers. Free users get core features and full accessibility. Gold and Platinum subscribers unlock theme customization, layout preferences, analytics, reels preferences, and advanced notification controls."
          }
        }
      ]
    }
    </script>
